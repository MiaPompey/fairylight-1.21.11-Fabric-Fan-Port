steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Grant execute permission for gradlew
    run: chmod +x ./FairyLightsFabric-1.21.1/FairyLightsFabric-1.21.1/gradlew || true

  - name: Build (refresh deps + compile fabric)
    working-directory: ./FairyLightsFabric-1.21.1/FairyLightsFabric-1.21.1
    run: |
      ./gradlew --no-daemon --no-parallel --refresh-dependencies clean :fabric:compileJava --stacktrace

  - name: Upload build logs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: port-build-logs
      path: FairyLightsFabric-1.21.1/FairyLightsFabric-1.21.1/build/reports || .
